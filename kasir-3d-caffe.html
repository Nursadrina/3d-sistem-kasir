/* ============ PERSISTENCE ============ */
var PKEY = "3d-caffe-pos-v1";
function persist(){
  try{
    localStorage.setItem(PKEY, JSON.stringify({
      lang:state.lang, theme:state.theme,
      transactions:state.transactions, cashier:state.cashier
    }));
  }catch(e){}
}
function loadPersisted(){
  try{
    var data = JSON.parse(localStorage.getItem(PKEY));
    if(data){
      if(data.lang) state.lang = data.lang;
      if(data.theme) state.theme = data.theme;
      if(data.transactions) state.transactions = data.transactions;
      if(data.cashier) state.cashier = data.cashier;
    }
  }catch(e){}
}

/* ============ HELPERS ============ */
function formatIDR(n){
  if(!Number.isFinite(n)) n = 0;
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}
function formatMoneyInput(s){
  var d = (s||"").toString().replace(/[^0-9]/g,"");
  return d ? parseInt(d,10) : 0;
}
function pad2(n){return n<10?"0"+n:""+n;}
function generateTrxNo(d){
  d = d || new Date();
  return "TRX-" + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + "-" +
    pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
}
function formatDateTime(ts){
  var d = new Date(ts);
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}) + ", " +
         d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
}
function ymd(d){
  d = d ? new Date(d) : new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function subtotal(){return state.cart.reduce(function(s,it){return s+it.price*it.qty;},0);}
function cartCount(){return state.cart.reduce(function(s,it){return s+it.qty;},0);}
function escapeAttr(s){return (s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function escapeHtml(s){
  return (s||"").toString()
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ============ TOAST ============ */
function toast(msg, type){
  var wrap = document.getElementById("toast-wrap");
  var el = document.createElement("div");
  el.className = "toast" + (type ? " "+type : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function(){
    el.style.opacity = "0";
    el.style.transform = "translateY(-8px)";
    el.style.transition = "all .2s";
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 250);
  }, 1800);
}

function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);

  if(state.theme === "dark"){
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>';
  }else{
    icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  }
}
function toggleTheme(){
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme(); persist();
}

/* ============ LANG ============ */
function applyLang(){
  document.documentElement.setAttribute("lang", state.lang);
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k = el.getAttribute("data-i18n");
    if(I18N[k]) el.textContent = I18N[k][state.lang];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
    var k = el.getAttribute("data-i18n-ph");
    if(I18N[k]) el.setAttribute("placeholder", I18N[k][state.lang]);
  });
  renderAll();
}
function toggleLang(){
  state.lang = state.lang === "id" ? "en" : "id";
  applyLang(); persist();
}

  if(v === "history") renderHistory();
}

/* ============ MENU RENDER ============ */
function renderCatTabs(){
  var wrap = document.getElementById("cat-tabs");
  wrap.innerHTML = "";
  CATS.forEach(function(c){
    var btn = document.createElement("button");
    btn.className = "cat-tab" + (state.selectedCat === c.key ? " active" : "");
    btn.innerHTML = c.emoji + " " + catLabel(c.key);
    btn.onclick = function(){ state.selectedCat = c.key; renderCatTabs(); renderMenu(); };
    wrap.appendChild(btn);
  });
}

function renderMenu(){
  var q = (document.getElementById("search").value || "").toLowerCase().trim();
  var grid = document.getElementById("menu-grid");
  var filtered = MENU.filter(function(p){
    if(state.selectedCat !== "all" && p.cat !== state.selectedCat) return false;
    if(!q) return true;
    return p.name.toLowerCase().indexOf(q) >= 0 ||
           p.nameEn.toLowerCase().indexOf(q) >= 0 ||
           (p.desc||"").toLowerCase().indexOf(q) >= 0;
  });
  if(filtered.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted-fg);padding:32px;">🔍<br>' + (state.lang === "id" ? "Tidak ada menu yang cocok." : "No matching menu items.") + '</div>';
    return;
  }
  grid.innerHTML = "";
  filtered.forEach(function(p){
    var inCart = state.cart.find(function(it){return it.id === p.id;});
    var card = document.createElement("button");
    card.className = "menu-card" + (inCart ? " in-cart" : "");
    var addIcon = inCart
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="12" height="12"><polyline points="20 6 9 17 4 12"/></svg> ' + inCart.qty
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ' + tt("addItem");
    card.innerHTML =
      '<div class="menu-card-head">' +
        '<div class="menu-emoji">' + p.emoji + '</div>' +
        '<div class="menu-info">' +
          '<div class="menu-name">' + (state.lang === "id" ? p.name : p.nameEn) + '</div>' +
          '<div class="menu-desc">' + (state.lang === "id" ? p.desc : p.descEn) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="menu-foot">' +
        '<span class="menu-price">' + formatIDR(p.price) + '</span>' +
        '<span class="menu-add">' + addIcon + '</span>' +
      '</div>';
    card.onclick = function(){ addToCart(p); };
    grid.appendChild(card);
  });
}

/* ============ CART ============ */
function addToCart(p){
  var ex = state.cart.find(function(it){return it.id === p.id;});
  if(ex){ ex.qty++; }
  else{ state.cart.push({id:p.id,name:p.name,nameEn:p.nameEn,price:p.price,emoji:p.emoji,qty:1}); }
  toast((state.lang === "id" ? p.name : p.nameEn) + " " + (state.lang === "id" ? "ditambahkan" : "added"), "success");
  renderCart(); renderMenu();
}
function decFromCart(id){
  var it = state.cart.find(function(x){return x.id === id;});
  if(!it) return;
  it.qty--;
  if(it.qty <= 0) state.cart = state.cart.filter(function(x){return x.id !== id;});
  renderCart(); renderMenu();
}
function incFromCart(id){
  var it = state.cart.find(function(x){return x.id === id;});
  if(!it) return;
  it.qty++;
  renderCart(); renderMenu();
}
function removeFromCart(id){
  state.cart = state.cart.filter(function(x){return x.id !== id;});
  renderCart(); renderMenu();
}
function clearCart(){
  state.cart = []; state.amountPaid = 0; state.qrisPaid = false;
  state.tableNo = ""; state.customerName = "";
  renderCart(); renderMenu();
}

function renderCart(){
  var bodyHTML = cartBodyHTML();
  var footerHTML = cartFooterHTML();
  var panelHTML = '<div class="cart-header"><span class="cart-title">' + svgIcon("cartIcon") + tt("cartTitle") + '</span>' +
    (state.cart.length > 0 ? '<button class="btn-link" onclick="clearCart()">' + svgIcon("trash") + tt("clearCart") + '</button>' : '') +
    '</div>';
  if(state.cart.length === 0){
    panelHTML += bodyHTML;
  }else{
    panelHTML += '<div class="cart-body">' + bodyHTML + '</div>';
    panelHTML += '<div class="cart-footer">' + footerHTML + '</div>';
  }
  document.getElementById("cart-panel-desktop").innerHTML = panelHTML;
  document.getElementById("cart-panel-mobile").innerHTML = panelHTML;
  // Mobile bottom bar
  var bar = document.getElementById("mobile-cart-bar");
  if(cartCount() > 0){
    bar.classList.add("show");
    document.getElementById("mobile-cart-qty").textContent = cartCount();
    document.getElementById("mobile-cart-total").textContent = formatIDR(subtotal());
  }else{
    bar.classList.remove("show");
  }
  // Cart count badge
  var badge = document.getElementById("cart-count-badge");
  var num = document.getElementById("cart-count-num");
  if(cartCount() > 0){
    badge.classList.add("show");
    num.textContent = cartCount();
  }else{
    badge.classList.remove("show");
  }
}

function setOrderType(t){ state.orderType = t; renderCart(); }
function setTableNo(v){
  state.tableNo = v;
  syncCheckoutAvailability();
}
function setCustomerName(v){ state.customerName = v; }
function setPayment(m){ state.payment = m; state.amountPaid = 0; state.qrisPaid = false; renderCart(); }
function setAmountPaid(v){ state.amountPaid = formatMoneyInput(v); renderCart(); }
function setAmountPaidRaw(n){ state.amountPaid = n; renderCart(); }
function toggleQrisPaid(){ state.qrisPaid = !state.qrisPaid; renderCart(); }

function syncCheckoutAvailability(){
  var canCheckout = state.cart.length > 0 &&
    (state.payment === "qris" ? state.qrisPaid : state.amountPaid >= subtotal()) &&
    (state.orderType !== "dine-in" || state.tableNo.trim() !== "");
  var buttons = document.querySelectorAll(".cart-panel .btn-primary");
  buttons.forEach(function(button){
    if(canCheckout) button.removeAttribute("disabled");
    else button.setAttribute("disabled", "");
  });
}

/* ============ CHECKOUT ============ */
function handleCheckout(){
  if(state.cart.length === 0){ toast(tt("emptyCartWarn"), "error"); return; }
  if(state.orderType === "dine-in" && !state.tableNo.trim()){ toast(tt("needTable"), "error"); return; }
  if(state.payment === "cash" && state.amountPaid < subtotal()){ toast(tt("insufficient"), "error"); return; }
  if(state.payment === "qris" && !state.qrisPaid){ toast(state.lang === "id" ? "Konfirmasi pembayaran QRIS dulu." : "Confirm QRIS payment first.", "error"); return; }

  var st = subtotal();
  var now = new Date();
  var tx = {
    id: "TX-" + now.getTime(),
    trxNo: generateTrxNo(now),
    items: state.cart.map(function(it){ return {id:it.id,name:it.name,nameEn:it.nameEn,price:it.price,qty:it.qty}; }),
    subtotal: st, total: st,
    orderType: state.orderType,
    tableNo: state.orderType === "dine-in" ? state.tableNo : null,
    customerName: state.customerName || null,
    payment: state.payment,
    amountPaid: state.payment === "cash" ? state.amountPaid : st,
    change: state.payment === "cash" ? state.amountPaid - st : 0,
    cashier: state.cashier,
    createdAt: now.getTime()
  };
  state.transactions.unshift(tx);
  state.transactions = state.transactions.slice(0, 500);
  state.selectedTrx = tx;
  persist();
  clearCart();
  closeDrawer();
  renderReceipt(tx);
  openReceiptModal();
  toast((state.lang === "id" ? "Transaksi " : "Transaction ") + tx.trxNo + (state.lang === "id" ? " berhasil!" : " success!"), "success");
}

        '</div>' +
      '</div>' +
      '<div style="text-align:right;"><div class="history-total">' + formatIDR(tx.total) + '</div>' +
      '<button class="history-view-btn" onclick="viewTrx(\'' + tx.id + '\')">' + tt("viewReceipt") + '</button></div>';
    listEl.appendChild(item);
  });
}

function viewTrx(id){
  var tx = state.transactions.find(function(x){return x.id === id;});
  if(!tx) return;
  state.selectedTrx = tx;
  renderReceipt(tx);
  openReceiptModal();
}

/* ============ INIT ============ */
function renderAll(){
  renderCatTabs(); renderMenu(); renderCart();
  if(state.view === "history") renderHistory();
}

function init(){
  loadPersisted();
  applyTheme();
  document.documentElement.setAttribute("lang", state.lang);
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k = el.getAttribute("data-i18n");
    if(I18N[k]) el.textContent = I18N[k][state.lang];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
    var k = el.getAttribute("data-i18n-ph");
    if(I18N[k]) el.setAttribute("placeholder", I18N[k][state.lang]);
  });
  renderAll();
}

document.getElementById("receipt-modal").addEventListener("click", function(e){
  if(e.target === this) closeReceiptModal();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(document.getElementById("receipt-modal").classList.contains("open")) closeReceiptModal();
    if(document.getElementById("drawer").classList.contains("open")) closeDrawer();
  }
});

init();
</script>
</body>
</html>
